<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тапочка</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f3f4f6;
    }

    .clicker-container {
      text-align: center;
    }

    .click-button {
      background: none;
      border: none;
      cursor: pointer;
      outline: none;
    }

    .click-button img {
      width: 200px;
      height: auto;
      transition: transform 0.1s ease;
    }

    .click-button:active img {
      transform: scale(0.95);
    }

    .counter {
      margin-top: 20px;
      font-size: 24px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="clicker-container">
    <button class="click-button" onclick="incrementCounter()">
      <img src="https://ir.ozone.ru/s3/multimedia-q/wc1000/6828966962.jpg" alt="Click Me">
    </button>
    <div class="counter" id="counter">Нажатий: 0</div>
  </div>

  <script>
    let clickCount = 0;

    function incrementCounter() {
      clickCount++;
      document.getElementById('counter').textContent = `Clicks: ${clickCount}`;
    }
  </script>
</body>
</html>
